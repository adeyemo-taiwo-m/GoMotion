  .official-logo { display: block; width: 900px; max-width: 100%; height: auto; object-fit: contain; }

  .end-tagline { margin: 0; max-width: 880px; color: #fff; font-family: "Space Grotesk", Inter, sans-serif; font-size: 72px; line-height: 1.02; letter-spacing: -.045em; font-weight: 700; }
  .end-tagline span { color: var(--green-bright); }
  .end-support { margin: 28px 0 0; max-width: 700px; color: #c3cdc6; font-size: 30px; line-height: 1.32; letter-spacing: .01em; }
  .end-contact { display: flex; align-items: center; gap: 24px; margin-top: 70px; color: #f6f8f2; font-size: 32px; font-weight: 600; letter-spacing: .01em; }
  .contact-divider { width: 6px; height: 6px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 14px var(--green-bright); }
  .end-cta { margin-top: 54px; padding: 24px 42px; border: 1px solid rgb(94 232 123 / .75); border-radius: 999px; color: #eaffec; background: linear-gradient(100deg, rgb(22 163 52 / .25), rgb(5 71 35 / .55)); box-shadow: 0 0 34px rgb(22 163 52 / .24), inset 0 0 24px rgb(94 232 123 / .08); font-size: 30px; font-weight: 700; letter-spacing: .02em; }
  .end-foot { position: absolute; left: 0; right: 0; bottom: 80px; text-align: center; color: rgb(216 235 218 / .54); font-size: 22px; letter-spacing: .2em; text-transform: uppercase; }

  @keyframes breathe { 0%,100% { transform: scale(.96); opacity: .65; } 50% { transform: scale(1.04); opacity: 1; } }
  @keyframes shimmer { 0% { transform: translateX(-110%) rotate(-23deg); } 100% { transform: translateX(120%) rotate(-23deg); } }
  @keyframes status { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .end-ambient { animation: breathe 5s ease-in-out infinite; }
  .solar-panel::after { animation: shimmer 4.7s ease-in-out infinite; }
  .battery::after, .inverter::after { animation: status 1.6s ease-in-out infinite; }
</style>
</head>
<body>
  <!-- soundtrack.wav is muxed into the final MP4 after the frame render. -->
  <main data-sequence data-transition="push-up 0.7">

    <section class="scene scene-problem" id="problem" data-duration="5.2" data-camera="push 1.04">
      <div class="problem-room">
        <div class="problem-wall"></div>
        <div class="problem-ceiling"></div>
        <div class="problem-floor"></div>
        <div class="problem-window"><div class="window-light"></div><div class="window-city"></div></div>
        <div class="problem-fan" data-expect="in-by 1.2; hold 1.0; gone-by 5.2">
          <div class="fan-stem"></div>
          <div class="fan-blades" id="problem-fan-blades"><i class="fan-blade"></i><i class="fan-blade"></i><i class="fan-blade"></i></div>
          <div class="fan-hub"></div>
        </div>
        <div class="problem-table"></div>
        <div class="problem-laptop"></div>
        <div class="problem-owner"><div class="owner-hair"></div><div class="owner-head"></div><div class="owner-body"></div><div class="owner-arm"></div></div>
        <div class="problem-heat"></div>
        <div class="problem-light-wash"></div>
        <div class="power-led"></div>
      </div>
    </section>

    <section class="scene scene-solution" id="solution" data-duration="5.3" data-camera="push 1.06">
      <div class="solution-sky"></div>
      <div class="solution-sun"></div>
      <div class="solution-haze"></div>
      <div class="solution-horizon"></div>
      <div class="solution-home"><div class="home-wall"></div><div class="home-window"></div></div>
      <div class="roof-plane"></div>
      <div class="panel-array">
        <div class="solar-panel" data-expect="in-by 7.0; hold 1.5"></div><div class="solar-panel"></div><div class="solar-panel"></div>
        <div class="solar-panel"></div><div class="solar-panel"></div><div class="solar-panel"></div>
        <div class="solar-panel"></div><div class="solar-panel"></div><div class="solar-panel"></div>
      </div>
      <div class="technician"><div class="tech-helmet"></div><div class="tech-head"></div><div class="tech-torso"></div><div class="tech-leg left"></div><div class="tech-leg right"></div></div>
      <div class="sun-streak"></div>
    </section>

    <section class="scene scene-tech" id="tech" data-duration="6.1" data-camera="pull 1.05">
      <div class="tech-backdrop"></div>
      <div class="tech-grid"></div>
      <div class="equipment-glow"></div>
      <div class="macro-panel"></div>
      <div class="equipment-rack">
        <div class="inverter" data-expect="in-by 10.5; hold 2.5"><div class="inverter-screen"></div></div>
        <div class="battery-stack"><div class="battery"></div><div class="battery"></div><div class="battery"></div></div>
        <div class="cable"></div>
      </div>
    </section>

    <section class="scene scene-comfort" id="comfort" data-duration="6.2" data-camera="push 1.12">
      <div class="comfort-room"><div class="comfort-wall"></div><div class="comfort-floor"></div></div>
      <div class="comfort-window"></div>
      <div class="comfort-light"></div>
      <div class="comfort-fan">
        <div class="fan-blades" id="comfort-fan-blades"><i class="fan-blade"></i><i class="fan-blade"></i><i class="fan-blade"></i></div>
        <div class="fan-hub"></div>
      </div>
      <div class="comfort-lamp"><div class="lamp-shade"></div><div class="lamp-pole"></div><div class="lamp-base"></div></div>
      <div class="comfort-sofa"><div class="sofa-seat"></div><div class="sofa-pillow one"></div><div class="sofa-pillow two"></div></div>
      <div class="comfort-family" data-expect="in-by 16.0; hold 3.0"><div class="person one"></div><div class="person two"></div></div>
      <div class="comfort-table"></div><div class="comfort-laptop"></div>
      <div class="comfort-plants"><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div><div class="leaf d"></div><div class="plant-pot"></div></div>
    </section>

    <section class="scene scene-end" id="endcard" data-duration="7.2" data-camera="push 1.04">
      <div class="end-ambient"></div>
      <div class="end-ring"></div>
      <div class="end-lockup">
        <img class="official-logo" id="official-logo" data-expect="in-by 21.0; hold 3.5" src="logo.png" alt="Code Green official logo">
        <div class="end-rule"></div>
        <h1 class="end-tagline">Power Your Life.<br><span>On Your Terms.</span></h1>
        <p class="end-support">Reliable Solar Solutions for Homes and Businesses.</p>
        <div class="end-contact"><span>+234 812 103 0393</span><i class="contact-divider"></i><span>@codegreen_ltd</span></div>
        <div class="end-cta">Make the Switch Today</div>
      </div>
      <div class="end-foot">CODE GREEN • SOLAR ENERGY</div>
    </section>
  </main>

  <script>
    const problem = gm.timeline('#problem');
    problem
      .from('.problem-window', { x: -150, opacity: 0, duration: 1, ease: 'power3.out' }, 0)
      .from('.problem-fan', { y: -120, opacity: 0, duration: 1, ease: 'power3.out' }, .15)
      .from('.problem-table, .problem-laptop', { y: 80, opacity: 0, duration: .85, ease: 'power3.out', stagger: .08 }, .35)
      .from('.problem-owner', { x: 120, opacity: 0, duration: 1.1, ease: 'power3.out' }, .45)
      .to('.problem-light-wash', { opacity: .08, duration: .24, ease: 'power2.in' }, 2.15)
      .to('.problem-room', { filter: 'brightness(.72) saturate(.8)', duration: .4, ease: 'power2.in' }, 2.15)
      .to('.power-led', { opacity: 1, duration: .25, ease: 'power2.out' }, 2.3)
      .to('.problem-heat', { opacity: .92, scale: 1.16, duration: 1.3, ease: 'sine.inOut' }, 2.2)
      .to('.problem-owner', { x: -24, y: 12, duration: 1.3, ease: 'sine.inOut' }, 2.35);

    gm.onFrame('#problem', t => {
      const blades = document.querySelector('#problem-fan-blades');
      const angle = t < 2.15 ? t * 620 : 1333 + Math.max(0, t - 2.15) * 82;
      blades.style.transform = `rotate(${angle}deg)`;
    });

    const solution = gm.timeline('#solution');
    solution
      .from('.solution-sun', { scale: .55, opacity: 0, duration: 1.25, ease: 'sine.out' }, 0)
      .from('.solution-home', { y: 160, opacity: 0, duration: 1.1, ease: 'power3.out' }, .15)
      .from('.roof-plane', { y: 160, rotate: -4, opacity: 0, duration: 1, ease: 'power3.out' }, .35)
      .from('.solar-panel', { y: 260, opacity: 0, duration: .95, ease: 'power3.out', stagger: .08 }, .58)
      .from('.technician', { x: 180, y: 90, opacity: 0, duration: 1.05, ease: 'power3.out' }, .75)
      .from('.sun-streak', { x: -600, opacity: 0, duration: 1.6, ease: 'sine.inOut' }, 1.2)
      .to('.solution-sun', { x: 180, y: 160, opacity: .72, duration: 4.5, ease: 'sine.inOut' }, .7)
      .to('.technician', { x: -16, y: -22, duration: 3.8, ease: 'sine.inOut' }, 1.2);

    const tech = gm.timeline('#tech');
    tech
      .from('.macro-panel', { x: -420, opacity: 0, duration: 1.2, ease: 'power3.out' }, 0)
      .from('.inverter', { x: 320, opacity: 0, duration: 1.1, ease: 'power3.out' }, .18)
      .from('.battery', { x: 260, y: 140, opacity: 0, duration: .9, ease: 'power3.out', stagger: .13 }, .48)
      .from('.cable', { scaleY: 0, opacity: 0, transformOrigin: 'top center', duration: .7, ease: 'power2.out' }, 1)
      .to('.equipment-glow', { opacity: .9, scale: 1.18, duration: 3.8, ease: 'sine.inOut' }, .4)
      .to('.inverter-screen', { opacity: 1, scale: 1.04, duration: 1.5, ease: 'sine.inOut' }, 1.6)
      .to('.macro-panel', { x: -40, duration: 4.4, ease: 'sine.inOut' }, .8);

    const comfort = gm.timeline('#comfort');
    comfort
      .from('.comfort-window', { x: -180, opacity: 0, duration: 1.05, ease: 'power3.out' }, 0)
      .from('.comfort-sofa', { y: 160, opacity: 0, duration: 1, ease: 'power3.out' }, .15)
      .from('.comfort-family', { x: 140, opacity: 0, duration: 1.05, ease: 'power3.out' }, .35)
      .from('.comfort-lamp, .comfort-fan', { y: -100, opacity: 0, duration: .8, ease: 'power3.out', stagger: .12 }, .45)
      .from('.comfort-table, .comfort-laptop', { y: 100, opacity: 0, duration: .75, ease: 'power3.out', stagger: .1 }, .65)
      .from('.comfort-plants', { x: 80, opacity: 0, duration: .9, ease: 'power3.out' }, .85)
      .to('.comfort-light', { opacity: 1, duration: 1.8, ease: 'sine.inOut' }, .45)
      .to('.comfort-family', { x: -22, duration: 4.4, ease: 'sine.inOut' }, 1.1)
      .to('.comfort-light', { x: -18, y: 10, scale: 1.08, opacity: .82, duration: 5.1, ease: 'sine.inOut' }, .75)
      .to('.comfort-window', { x: 42, duration: 5.4, ease: 'sine.inOut' }, .6)
      .to('.comfort-room', { scale: 1.06, x: -28, duration: 5.6, ease: 'sine.inOut' }, .3)
      .to('.comfort-sofa', { x: -34, duration: 5.2, ease: 'sine.inOut' }, .5)
      .to('.comfort-family', { x: -66, duration: 5.2, ease: 'sine.inOut' }, .55);

    gm.onFrame('#comfort', t => {
      document.querySelector('#comfort-fan-blades').style.transform = `rotate(${t * 740}deg)`;
    });

    const end = gm.timeline('#endcard');
    end
      .from('.end-ring', { scale: .65, opacity: 0, duration: 1.1, ease: 'sine.out' }, 0)
      .from('#official-logo', { scale: .84, opacity: 0, filter: 'blur(12px)', duration: 1.05, ease: 'back.out(1.5)' }, .28)
      .from('.end-rule', { scaleX: 0, opacity: 0, duration: .7, ease: 'power3.out' }, 1.12)
      .from('.end-tagline', { y: 48, opacity: 0, filter: 'blur(7px)', duration: .8, ease: 'power3.out' }, 1.34)
      .from('.end-support', { y: 26, opacity: 0, duration: .65, ease: 'power3.out' }, 1.82)
      .from('.end-contact', { y: 30, opacity: 0, duration: .7, ease: 'power3.out' }, 2.24)
      .from('.end-cta', { y: 26, opacity: 0, scale: .94, duration: .7, ease: 'back.out(1.4)' }, 2.68)
      .from('.end-foot', { opacity: 0, duration: .5, ease: 'power2.out' }, 3.36)
      .to('.end-ring', { rotate: 8, scale: 1.08, duration: 5.6, ease: 'sine.inOut' }, .5)
      .to('.end-ambient', { opacity: .85, duration: 2.5, ease: 'sine.inOut' }, 1.1);
  </script>
</body>
</html>
